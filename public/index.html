<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetupPass — AWS User Group Madurai</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">Meetup<span>Pass</span></a>
  <div class="nav-links">
    <a href="/">Events</a>
    <a href="/checkin.html">Check-In</a>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/platform.html">Platform</a>
  </div>
</nav>

<div class="hero">
  <h1>Welcome to <span>MeetupPass</span></h1>
  <p>Event check-in made simple for AWS User Group Madurai. Create events, manage RSVPs, and check in attendees — all in your browser.</p>
  <button class="btn btn-primary btn-lg" onclick="document.getElementById('create-form').scrollIntoView({behavior:'smooth'})">
    ＋ Create Event
  </button>
</div>

<div class="container">

  <!-- Events List -->
  <div class="page-header mt-3">
    <h1>Upcoming Events</h1>
    <p>Click an event to RSVP or manage it.</p>
  </div>

  <div id="events-container">
    <p class="text-muted">Loading events…</p>
  </div>

  <!-- Create Event Form -->
  <div id="create-form" class="card mt-3">
    <div class="card-title">Create New Event</div>
    <form id="event-form">
      <div class="form-group">
        <label for="evt-name">Event Name</label>
        <input id="evt-name" type="text" placeholder="AWS User Group Madurai – August Meetup" required />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label for="evt-date">Date</label>
          <input id="evt-date" type="date" required />
        </div>
        <div class="form-group">
          <label for="evt-capacity">Capacity</label>
          <input id="evt-capacity" type="number" min="1" placeholder="60" required />
        </div>
      </div>
      <div class="form-group">
        <label for="evt-venue">Venue</label>
        <input id="evt-venue" type="text" placeholder="TIDEL Park, Madurai" required />
      </div>
      <button type="submit" class="btn btn-primary">Create Event</button>
    </form>
  </div>

</div>

<script type="module">
  import { api, fmtDate, toast } from '/app.js';

  async function loadEvents() {
    const container = document.getElementById('events-container');
    try {
      const events = await api('/api/events');
      if (events.length === 0) {
        container.innerHTML = '<div class="card"><p class="text-muted">No events yet. Create one below!</p></div>';
        return;
      }
      container.innerHTML = `<div class="event-grid">${events.map(renderEventCard).join('')}</div>`;
    } catch (e) {
      container.innerHTML = `<div class="card"><p class="text-muted">Failed to load events: ${e.message}</p></div>`;
    }
  }

  function renderEventCard(evt) {
    const platformBadge = evt.platformMeetupId && evt.meetupUrl
      ? `<a class="badge badge-success" href="${esc(evt.meetupUrl)}" target="_blank" rel="noopener" style="font-size:0.7rem;text-decoration:none;" title="Imported from awsugmdu.in">🌐 awsugmdu.in</a>`
      : '';
    return `
      <div class="event-card">
        <div class="event-card-name">${esc(evt.name)} ${platformBadge}</div>
        <div class="event-card-meta">
          <span>📅 ${fmtDate(evt.date)}</span>
          <span>📍 ${esc(evt.venue)}</span>
          <span>👥 Capacity: ${evt.capacity}</span>
          ${evt.attendeePoints ? `<span>🏆 ${evt.attendeePoints} pts/check-in</span>` : ''}
        </div>
        <div class="event-card-actions">
          <a class="btn btn-primary btn-sm" href="/rsvp.html?eventId=${evt.id}">RSVP</a>
          <a class="btn btn-outline btn-sm" href="/dashboard.html?eventId=${evt.id}">Dashboard</a>
          <a class="btn btn-outline btn-sm" href="/checkin.html?eventId=${evt.id}">Check-In</a>
        </div>
      </div>`;
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('event-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating…';
    try {
      const event = await api('/api/events', {
        method: 'POST',
        body: {
          name: document.getElementById('evt-name').value.trim(),
          date: document.getElementById('evt-date').value,
          venue: document.getElementById('evt-venue').value.trim(),
          capacity: document.getElementById('evt-capacity').value,
        },
      });
      toast(`Event "${event.name}" created!`, 'success');
      e.target.reset();
      await loadEvents();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Event';
    }
  });

  loadEvents();
</script>
</body>
</html>
